name: release build
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: github.repository_owner == 'chaudhryfaisal'
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: |
        go mod download -x

    - name: Build
      run: |
        bash scripts/make_release.sh gzip amd64
        bash scripts/make_release.sh gzip amd64 static
        bash scripts/make_release.sh gzip 386 purego
        bash scripts/make_release.sh gzip arm64 purego
        bash scripts/make_release.sh gzip darwin purego

    - name: Generate Git Log
      run: |
        go version
        git fetch origin +refs/tags/*:refs/tags/*
        echo "Current Tag: ${GITHUB_REF_NAME}"
        GITVER=$(git describe --tags)
        PREVVER=$(git describe --tags --abbrev=0 ${GITVER}~1 2>/dev/null || true)
        if [ -n "${PREVVER}" ]; then RANGE="${PREVVER}..${GITVER}"; else RANGE="${GITVER}"; fi
        git log --oneline ${RANGE} | tee -a gittaglogs.txt

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          cloud-torrent_linux_amd64.gz
          cloud-torrent_linux_amd64_static.gz
          cloud-torrent_linux_386_static.gz
          cloud-torrent_linux_arm64_static.gz
          cloud-torrent_darwin_amd64_static.gz
        prerelease: false
        draft: true
        body_path: gittaglogs.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
